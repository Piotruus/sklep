name: Build SklepGUI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Javę 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Buduj plugin
        run: mvn -B clean package -f SklepGUI/pom.xml

      - name: Udostępnij plik JAR
        uses: actions/upload-artifact@v4
        with:
          name: SklepGUI
          path: SklepGUI/target/*.jar
